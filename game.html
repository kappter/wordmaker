<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Creator Game</title>
    <link rel="icon" href="data:,">
    <!-- Reuse the serif font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <!-- Corrected link to the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Word Creator Game</h1>

    <div id="loading" class="loading-indicator">Loading word parts...</div>

    <main>
        <!-- Theme Selection Screen -->
        <div id="themeSelection" class="controls">
            <div>
                <label for="gameThemeType">Select Theme:</label>
                <select id="gameThemeType">
                    <option value="normal">Normal</option>
                    <option value="technical">Technical</option>
                    <option value="shakespearian">Shakespearian</option>
                    <option value="popculture">Pop Culture</option>
                    <option value="astronomy">Astronomy</option>
                    <option value="fantasy">Fantasy</option>
                </select>
            </div>
            <button id="startButton" class="btn btn-generate">Start Game</button>
        </div>

        <!-- Game Area (hidden initially) -->
        <div id="gameArea" style="display: none;">
            <div id="wordContainer">
                <p id="questionNumber">Question 1 of 5</p>
                <p id="score">Score: 0</p>
                <p id="misses">Misses: 0/3</p>
                <p id="wordDefinition" class="definition"></p>
                <div id="options" class="options">
                    <!-- Options will be populated by JS -->
                </div>
                <p id="feedback" class="feedback"></p>
            </div>
            <div class="buttons">
                <button id="nextButton" class="btn btn-generate" style="display: none;">Next Question</button>
            </div>
        </div>

        <!-- Game Over Screen (hidden initially) -->
        <div id="gameOver" style="display: none;">
            <div id="wordContainer">
                <h2>Game Over!</h2>
                <p id="finalScore"></p>
                <div class="buttons">
                    <a href="index.html"><button class="btn btn-copy">Back to Word Creator</button></a>
                    <button id="restartButton" class="btn btn-generate">Play Again</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Include script.js for shared functions -->
    <script src="script.js"></script>
    <!-- Link to the game script -->
    <script src="game.js"></script>
</body>
</html>
