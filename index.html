<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Creator</title> <!-- Changed title -->
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/output.css">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Link to a serif font, e.g., Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Add custom font family */
        body {
            font-family: 'Merriweather', serif;
            background-color: #f5f0e1; /* Light beige background */
        }
        /* Custom button styles to match image */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 9999px; /* Fully rounded */
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s ease;
            font-size: 1rem;
            border: none;
        }
        .btn-generate {
            background-color: #e89f43; /* Orange */
        }
        .btn-generate:hover {
            background-color: #d08c3a; /* Darker orange */
        }
        .btn-copy {
            background-color: #a0522d; /* Brown */
        }
        .btn-copy:hover {
            background-color: #8b4513; /* Darker brown */
        }
        /* Style for the word type selector */
        .word-type-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            color: #8b4513; /* Brown text */
            font-size: 1.1rem;
        }
        .word-type-selector label {
            margin-right: 0.5rem;
        }
        .word-type-selector select {
            padding: 0.5rem 1rem;
            border: 1px solid #d2b48c; /* Light brown border */
            border-radius: 0.375rem;
            background-color: #fffaf0; /* Floral white background */
            color: #8b4513;
            font-family: 'Merriweather', serif;
        }
        /* Word container styling */
        #wordContainer {
            background-color: #fffaf0; /* Floral white background */
            border: 2px solid #d2b48c; /* Light brown border */
            border-radius: 0.75rem; /* More rounded corners */
            padding: 2rem;
            margin: 0 auto;
            width: 90%;
            max-width: 500px; /* Limit width */
            box-shadow: 0 4px 8px rgba(139, 69, 19, 0.2); /* Brownish shadow */
            text-align: left; /* Align text left */
            color: #3a2d24; /* Dark brown text */
        }
        #generatedWord {
            font-size: 2rem; /* Larger font size */
            color: #d08c3a; /* Orange color */
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        #pronunciation {
            font-style: italic;
            color: #5c4033; /* Medium brown */
            margin-bottom: 1rem;
        }
        #wordDefinition {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
        }
        #otherFormsHeading {
            font-weight: bold;
            color: #d08c3a; /* Orange color */
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }
        #permutationList li {
            margin-bottom: 0.5rem;
            font-size: 1rem;
            color: #3a2d24;
        }
    </style>
</head>
<body class="flex flex-col items-center pt-10">
    <!-- Removed header, added title directly -->
    <h1 class="text-4xl font-bold mb-8" style="color: #8b4513;">Word Creator</h1>

    <div id="loading" class="text-center text-gray-500 mt-4 hidden">Loading word parts...</div>

    <main class="w-full px-4">
        <!-- Updated dropdown section -->
        <div class="word-type-selector">
            <label for="permutationType">Select Word Type:</label>
            <select id="permutationType">
                <option value="pre-root-suf">Prefix-Root-Suffix</option>
                <option value="root-suf">Root-Suffix</option>
                <option value="pre-root">Prefix-Root</option>
                <option value="pre-root-root">Prefix-Root-Root</option>
                <option value="root">Root Only</option>
            </select>
            <!-- Removed Theme dropdown -->
        </div>

        <div id="wordContainer" class="transition-opacity duration-300">
            <h2 id="generatedWord"></h2>
            <p id="pronunciation"></p>
            <p id="wordDefinition"></p>
            <!-- Updated "Other Forms" section -->
            <div>
                <h3 id="otherFormsHeading">Other Forms:</h3>
                <ul id="permutationList" class="list-disc list-inside"></ul>
            </div>
        </div>

        <!-- Updated buttons section -->
        <div class="flex justify-center space-x-4 mt-6">
            <button id="generateButton" class="btn btn-generate">Generate New Word</button>
            <button id="copyButton" class="btn btn-copy">Copy Word</button> <!-- Changed text -->
        </div>
    </main>

    <!-- Removed footer -->

    <script src="script.js"></script>
</body>
</html>
